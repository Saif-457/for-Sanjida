<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ভালোবাসার বার্তা</title>
  <!-- Google Bengali Font Import -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, #1a000c 0%, #050003 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Hind Siliguri', sans-serif;
      overflow: hidden;
      position: relative;
      color: #ffffff;
    }

    /* Floating Heart Particles Background */
    .heart-particle {
      position: absolute;
      color: #ff4d6d;
      font-size: 20px;
      user-select: none;
      pointer-events: none;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.2);
        opacity: 0;
      }
    }

    /* Central Heart Card Container */
    .card {
      position: relative;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 77, 109, 0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 77, 109, 0.2);
      animation: pulseGlow 3s ease-in-out infinite;
      z-index: 10;
    }

    /* Heart Icon Animation at the top */
    .big-heart {
      font-size: 60px;
      color: #ff4d6d;
      margin-bottom: 20px;
      display: inline-block;
      animation: beat 1.2s infinite ease-in-out;
      text-shadow: 0 0 20px rgba(255, 77, 109, 0.8);
    }

    /* Poem Styling */
    .poem {
      font-size: 1.25rem;
      line-height: 1.9;
      color: #ffe6ea;
      font-weight: 500;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    .poem span {
      display: block;
    }

    .poem .stanza {
      margin-bottom: 15px;
    }

    /* Pulse Glow Animation */
    @keyframes pulseGlow {
      0%, 100% {
        box-shadow: 0 0 25px rgba(255, 77, 109, 0.25);
        border-color: rgba(255, 77, 109, 0.3);
      }
      50% {
        box-shadow: 0 0 45px rgba(255, 77, 109, 0.5);
        border-color: rgba(255, 77, 109, 0.6);
      }
    }

    /* Heart Beat Animation */
    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }
      25% {
        transform: scale(1.15);
      }
      40% {
        transform: scale(1);
      }
      60% {
        transform: scale(1.12);
      }
    }
  </style>
</head>
<body>

  <!-- Card Container -->
  <div class="card">
    <div class="big-heart">❤</div>
    <div class="poem">
      <div class="stanza">
        <span>মহাপ্রলয়ে উড়িয়ে দেব</span>
        <span>যত বিস্ফোরণের শুকনো ছাই,</span>
        <span>আমি ব্রহ্মাণ্ডের প্রতিটি ধুলোয়</span>
        <span>লিখে দেব শুধু তোমাকে চাই।</span>
      </div>
      <div class="stanza">
        <span>তুমি হয়তো এখনো জানো না</span>
        <span>কারো সাধ্য নেই আমায় আটকায়,</span>
        <span>আমি ভালোবাসবো আবার তোমায়</span>
        <span>যত বেশি ভালোবাসা যায়।</span>
      </div>
    </div>
  </div>

  <!-- JavaScript for Generating Dynamic Floating Hearts -->
  <script>
    function createHeart() {
      if (document.hidden) return; // ট্যাব নিষ্ক্রিয় থাকলে পার্টিকেল তৈরি বন্ধ রাখবে

      const heart = document.createElement('div');
      heart.classList.add('heart-particle');
      heart.innerHTML = '❤️';
      
      const duration = Math.random() * 3 + 4; // ৪ থেকে ৭ সেকেন্ড
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = duration + 's';
      heart.style.fontSize = Math.random() * 15 + 10 + 'px';
      
      document.body.appendChild(heart);
      
      // অ্যানিমেশন শেষ হওয়ার পর এলিমেন্ট মুছে ফেলবে
      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    setInterval(createHeart, 300);
  </script>
</body>
</html>
