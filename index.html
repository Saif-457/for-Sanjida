<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Sanjida ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
      position: relative;
    }
    h1 {
      color: #e63946;
      font-size: 28px;
      margin-bottom: 30px;
    }
    .btn-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 80px;
      position: relative;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s;
    }
    .yes-btn {
      background-color: #ff4b2b;
      color: white;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
      z-index: 10;
    }
    .yes-btn:hover {
      transform: scale(1.05);
    }
    .sorry-btn {
      background-color: #6c757d;
      color: white;
      position: absolute;
      transition: all 0.2s ease;
    }
    .flower {
      position: absolute;
      font-size: 24px;
      animation: floatUp 3s linear forwards;
      pointer-events: none;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) scale(1.5) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1 id="heading">I Love You Sanjida ❤️</h1>
    <div class="btn-container">
      <button class="yes-btn" onclick="acceptLove()">I Love You Too Saif 💖</button>
      <button class="sorry-btn" id="sorryBtn" onmouseover="moveButton()" onclick="moveButton()">Sorry 🥺</button>
    </div>
  </div>

  <script>
    const sorryBtn = document.getElementById('sorryBtn');

    // Default Position for Sorry Button
    sorryBtn.style.right = '20px';

    function moveButton() {
      // Screen-er jekono jaygay dure sore jabe
      const x = Math.random() * (window.innerWidth - 120);
      const y = Math.random() * (window.innerHeight - 60);

      sorryBtn.style.position = 'fixed';
      sorryBtn.style.left = `${x}px`;
      sorryBtn.style.top = `${y}px`;
    }

    function acceptLove() {
      document.getElementById('heading').innerText = "I Love You Too Saif 💖🌹";
      sorryBtn.style.display = 'none';

      // Flower effect active kora
      for (let i = 0; i < 40; i++) {
        setTimeout(createFlower, i * 100);
      }
    }

    function createFlower() {
      const flowers = ['🌸', '🌺', '🌹', '🌷', '✨', '💖', '🌼'];
      const flower = document.createElement('div');
      flower.classList.add('flower');
      flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];

      flower.style.left = Math.random() * 100 + 'vw';
      flower.style.bottom = '0px';
      flower.style.fontSize = (Math.random() * 20 + 20) + 'px';

      document.body.appendChild(flower);

      setTimeout(() => {
        flower.remove();
      }, 3000);
    }
  </script>
</body>
</html>
